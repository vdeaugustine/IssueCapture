name: Release package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish GitHub Release
    runs-on: macos-14
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate package manifest
        run: swift package dump-package
      - name: Build iOS package
        run: xcodebuild -scheme IssueCapture -destination 'generic/platform=iOS Simulator' -configuration Release build CODE_SIGNING_ALLOWED=NO
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "IssueCapture $GITHUB_REF_NAME"
