<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IssueCapture</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="mark">⌗</span><div><strong>IssueCapture</strong><small>WEB CAPTURE</small></div></header>
<p>A little context.<br>A much clearer issue.</p>
<button id="capture" class="primary">Capture this page <span>↗</span></button>
<button id="inbox">Open issue inbox <span>→</span></button>
<button id="text">New text report <span>＋</span></button>
<p id="message" role="status">Screenshot + page context. Saved on this device.</p>
<footer>LOCAL FIRST <span>NO ACCOUNT NEEDED</span></footer>
<script type="module" src="popup.js"></script></body></html>
